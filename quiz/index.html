<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>October 2026 Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0a08;
      --bg-card: rgba(255,255,255,0.025);
      --border: rgba(255,255,255,0.06);
      --text: #e8e0d4;
      --text-dim: #8a7e6e;
      --gold: #c9a84c;
      --gold-glow: rgba(201,168,76,0.15);
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Geist', -apple-system, sans-serif; font-weight: 400;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 48px 24px; overflow-x: hidden;
    }

    .leaves { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .leaf { position: absolute; top: -40px; opacity: 0; animation: drift linear infinite; }
    @keyframes drift {
      0%   { transform: translateX(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateX(40px) rotate(300deg) translateY(105vh); opacity: 0; }
    }

    .card {
      position: relative; z-index: 1; max-width: 500px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 32px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: clamp(44px, 8vw, 72px) clamp(32px, 6vw, 64px);
    }

    .card-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--gold);
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif; font-weight: 700;
      font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.1;
      color: var(--text);
    }

    .rule {
      width: 32px; height: 1px; background: var(--gold);
      opacity: 0.3; border: none;
    }

    .card-msg {
      font-size: 1.1rem; font-weight: 500; line-height: 1.7; color: var(--text-dim);
    }

    .date-badge {
      font-family: 'Cormorant Garamond', serif; font-weight: 700;
      font-size: 1.5rem; color: var(--gold);
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 4px; padding: 14px 36px;
    }

    .mini-cd {
      display: flex; gap: 24px; justify-content: center;
    }
    .mini-cd .u { display: flex; flex-direction: column; align-items: center; }
    .mini-cd .n {
      font-family: 'Cormorant Garamond', serif; font-weight: 700;
      font-size: 2rem; color: var(--gold);
    }
    .mini-cd .l {
      font-size: 0.6rem; font-weight: 600; color: var(--text-dim);
      letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px;
    }

    .back {
      color: var(--text-dim); text-decoration: none; font-size: 0.9rem;
      font-weight: 500; letter-spacing: 0.04em; transition: color 0.2s;
    }
    .back:hover { color: var(--gold); }
  </style>
</head>
<body>

  <div class="leaves" id="leaves"></div>

  <div class="card">
    <p class="card-eyebrow">Results Committee</p>
    <h1 class="card-title">October 2026 Quiz</h1>
    <hr class="rule">
    <p class="card-msg">The quiz will be available on October 1st, 2026.</p>
    <div class="date-badge">October 1st</div>

    <div class="mini-cd">
      <div class="u"><div class="n" id="q-d">00</div><div class="l">Days</div></div>
      <div class="u"><div class="n" id="q-h">00</div><div class="l">Hours</div></div>
      <div class="u"><div class="n" id="q-m">00</div><div class="l">Min</div></div>
    </div>

    <a href="../" class="back">&#8592; Back to countdown</a>
  </div>

  <script>
    const qd = new Date('2026-10-01T00:00:00-04:00').getTime();
    function qt(){
      const d=Math.max(0,qd-Date.now());
      document.getElementById('q-d').textContent=String(Math.floor(d/864e5)).padStart(2,'0');
      document.getElementById('q-h').textContent=String(Math.floor((d%864e5)/36e5)).padStart(2,'0');
      document.getElementById('q-m').textContent=String(Math.floor((d%36e5)/6e4)).padStart(2,'0');
    }
    qt(); setInterval(qt,60000);

    const colors=['#6b2020','#b87333','#c9a84c','#4a2c12','#8b5e3c'];
    function makeLeaf(){
      const l=document.createElement('div');l.className='leaf';
      const c=colors[Math.random()*colors.length|0];
      l.innerHTML=`<svg viewBox="0 0 24 24" width="${14+Math.random()*10}" height="${14+Math.random()*10}"><path d="M12 2C12 2 4 8 4 15c0 4 3 7 8 7s8-3 8-7C20 8 12 2 12 2z" fill="${c}" opacity="0.6"/></svg>`;
      l.style.left=Math.random()*100+'vw';
      l.style.animationDuration=(12+Math.random()*12)+'s';
      l.style.animationDelay=Math.random()*4+'s';
      document.getElementById('leaves').appendChild(l);
      setTimeout(()=>l.remove(),28000);
    }
    setInterval(makeLeaf,2500);
    for(let i=0;i<4;i++) setTimeout(makeLeaf,i*600);
  </script>
</body>
</html>
