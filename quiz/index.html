<!DOCTYPE html>
<html lang="en">
<head>
      <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟡</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>October 2026 Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0a08;
      --bg-card: rgba(255,255,255,0.025);
      --border: rgba(255,255,255,0.06);
      --text: #e8e0d4;
      --text-dim: #8a7e6e;
      --gold: #c9a84c;
      --gold-glow: rgba(201,168,76,0.15);
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Geist', -apple-system, sans-serif; font-weight: 400;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 48px 24px 140px; overflow-x: hidden;
    }

    /* ---- night sky ---- */
    .sky {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 90% 40% at 50% 105%, rgba(196,106,31,0.22), transparent 70%),
        linear-gradient(180deg, #120d0a 0%, #0c0a08 55%, #140c07 100%);
    }
    .star {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: #e8e0d4; animation: twinkle ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: 0.1; } to { opacity: 0.7; } }

    /* ---- maple branch reaching in from the top-right corner ---- */
    .branch {
      position: fixed; top: 0; right: 0; z-index: 0; pointer-events: none;
      width: clamp(240px, 36vw, 500px); aspect-ratio: 4 / 3;
      transform-origin: 100% 10%; animation: branchsway 7s ease-in-out infinite alternate;
    }
    .branch svg.wood { position: absolute; inset: 0; width: 100%; height: 100%; }
    .branch .bl { position: absolute; transform-origin: 50% 0; animation: sway ease-in-out infinite alternate; }
    .branch .bl svg { display: block; width: 100%; height: auto; }
    .branch .perch { position: absolute; width: 17%; }
    .branch .perch svg { display: block; width: 100%; height: auto; transform: scaleX(-1); }
    .branch .perch .head { transform-box: view-box; transform-origin: 39px 30px; animation: gobble 3.4s ease-in-out infinite; }
    @keyframes gobble {
      0%, 70%, 100% { transform: rotate(0deg); }
      75% { transform: rotate(-14deg); } 80% { transform: rotate(8deg); }
      85% { transform: rotate(-14deg); } 90% { transform: rotate(0deg); }
    }
    @keyframes branchsway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
    @keyframes sway { from { transform: rotate(var(--r0)); } to { transform: rotate(var(--r1)); } }

    /* flying turkey silhouettes */
    .flyer {
      position: fixed; z-index: 0; pointer-events: none; left: 0;
      animation: fly linear forwards; opacity: 0.8;
    }
    .flyer svg { animation: flap 0.35s ease-in-out infinite alternate; transform-origin: 50% 50%; }
    @keyframes fly { from { transform: translate(calc(100vw + 60px), 0); } to { transform: translate(-120px, var(--drop, 40px)); } }
    @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(0.55); } }

    /* ---- falling leaves (spiral) ---- */
    .leaves { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .leaf { position: absolute; top: -60px; opacity: 0; animation: spiral linear forwards; }
    @keyframes spiral {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      8%   { opacity: 1; }
      25%  { transform: translate(var(--sx, 50px), 26vh) rotate(160deg); }
      50%  { transform: translate(calc(var(--sx, 50px) * -1), 52vh) rotate(320deg); }
      75%  { transform: translate(var(--sx, 50px), 78vh) rotate(480deg); }
      92%  { opacity: 1; }
      100% { transform: translate(0, 108vh) rotate(640deg); opacity: 0; }
    }

    /* ---- farmyard along the bottom ---- */
    .yard {
      position: fixed; left: 0; right: 0; bottom: 0; height: 130px;
      z-index: 0; pointer-events: none;
    }
    .yard .fence { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; }
    .yard .fence svg { width: 100%; height: 100%; display: block; }
    .yard .it { position: absolute; bottom: 0; }
    .yard .it svg { display: block; width: 100%; height: auto; }
    .peck .head { transform-box: view-box; transform-origin: 39px 30px; animation: peck 2.6s ease-in-out infinite; }
    @keyframes peck {
      0%, 55%, 100% { transform: rotate(0deg); }
      62% { transform: rotate(62deg); }
      68% { transform: rotate(10deg); }
      74% { transform: rotate(62deg); }
      82% { transform: rotate(0deg); }
    }
    .shock { transform-origin: 50% 100%; animation: shocksway 5s ease-in-out infinite alternate; }
    @keyframes shocksway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }

    /* ---- card ---- */
    .card-wrap { position: relative; z-index: 1; }

    .card {
      position: relative; max-width: 500px; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 32px;
      background: rgba(14,11,8,0.86); border: 1px solid rgba(201,168,76,0.18);
      border-radius: 10px; padding: clamp(44px, 8vw, 72px) clamp(32px, 6vw, 64px);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 80px rgba(196,106,31,0.12);
    }

    /* leaf wreath clusters on opposite corners */
    .cluster { position: absolute; width: 150px; height: 120px; pointer-events: none; z-index: 2; }
    .cluster.tl { top: -46px; left: -52px; }
    .cluster.br { bottom: -46px; right: -52px; transform: rotate(180deg); }
    .cluster .c { position: absolute; transform-origin: 20% 80%; animation: rustle ease-in-out infinite alternate; }
    @keyframes rustle { from { transform: rotate(var(--r0)); } to { transform: rotate(var(--r1)); } }

    .card-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--gold);
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif; font-weight: 700;
      font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.1;
      color: var(--text);
    }

    .rule {
      width: 32px; height: 1px; background: var(--gold);
      opacity: 0.3; border: none;
    }

    .card-msg {
      font-size: 1.1rem; font-weight: 500; line-height: 1.7; color: var(--text-dim);
    }

    .date-badge {
      font-family: 'Cormorant Garamond', serif; font-weight: 700;
      font-size: 1.5rem; color: var(--gold);
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 4px; padding: 14px 36px;
    }

    .mini-cd {
      display: flex; gap: 24px; justify-content: center;
    }
    .mini-cd .u { display: flex; flex-direction: column; align-items: center; }
    .mini-cd .n {
      font-family: 'Cormorant Garamond', serif; font-weight: 700;
      font-size: 2rem; color: var(--gold);
    }
    .mini-cd .l {
      font-size: 0.6rem; font-weight: 600; color: var(--text-dim);
      letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px;
    }

    .back {
      color: var(--text-dim); text-decoration: none; font-size: 0.9rem;
      font-weight: 500; letter-spacing: 0.04em; transition: color 0.2s;
    }
    .back:hover { color: var(--gold); }

    @media (max-width: 520px) {
      .cluster { width: 110px; height: 90px; }
      .cluster.tl { top: -34px; left: -30px; }
      .cluster.br { bottom: -34px; right: -30px; }
      .yard { height: 100px; }
      .yard .fence { height: 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .leaves, .flyer { display: none; }
      .star, .branch, .branch .bl, .branch .perch .head, .peck .head, .shock, .cluster .c { animation: none !important; }
    }
  </style>
</head>
<body>

  <div class="sky" id="sky"></div>
  <div class="branch" id="branch"></div>
  <div class="leaves" id="leaves"></div>
  <div class="yard" id="yard"><div class="fence" id="fence"></div></div>

  <div class="card-wrap">
    <div class="cluster tl" id="clusterTL"></div>
    <div class="cluster br" id="clusterBR"></div>

    <div class="card">
      <p class="card-eyebrow">Results Committee</p>
      <h1 class="card-title">October 2026 Quiz</h1>
      <hr class="rule">
      <p class="card-msg">The quiz will be available on October 1st, 2026.</p>
      <div class="date-badge">October 1st</div>

      <div class="mini-cd">
        <div class="u"><div class="n" id="q-d">00</div><div class="l">Days</div></div>
        <div class="u"><div class="n" id="q-h">00</div><div class="l">Hours</div></div>
        <div class="u"><div class="n" id="q-m">00</div><div class="l">Min</div></div>
      </div>

      <a href="../" class="back">&#8592; Back to countdown</a>
    </div>
  </div>

  <script>
    const qd = new Date('2026-10-01T00:00:00-04:00').getTime();
    function qt(){
      const d=Math.max(0,qd-Date.now());
      document.getElementById('q-d').textContent=String(Math.floor(d/864e5)).padStart(2,'0');
      document.getElementById('q-h').textContent=String(Math.floor((d%864e5)/36e5)).padStart(2,'0');
      document.getElementById('q-m').textContent=String(Math.floor((d%36e5)/6e4)).padStart(2,'0');
    }
    qt(); setInterval(qt,60000);

    /* ---------- shapes ---------- */
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[Math.random() * arr.length | 0];
    const colors = ['#6b2020','#b87333','#c9a84c','#4a2c12','#8b5e3c','#a33b1c'];

    const svg = {
      leaf: (s, c) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path d="M12 2C12 2 4 8 4 15c0 4 3 7 8 7s8-3 8-7C20 8 12 2 12 2z" fill="${c}" opacity="0.7"/><path d="M12 5v16" stroke="#0c0a08" stroke-width="0.8" opacity="0.4"/></svg>`,
      maple: (s, c) => `<svg viewBox="0 0 24 26" width="${s}" height="${s}"><path d="M12 1l2 4.5 3-1.2-.8 4.2 4.3.8-2.8 3 2 2.3-4.8.9.9 3.3-3.3-1L12 22l-.6-4.2-3.3 1 .9-3.3-4.8-.9 2-2.3-2.8-3 4.3-.8-.8-4.2 3 1.2z" fill="${c}" opacity="0.8"/><path d="M12 18v7" stroke="${c}" stroke-width="1.2"/></svg>`,
      acorn: s => `<svg viewBox="0 0 20 26" width="${s*0.8}" height="${s}"><path d="M10 1v4" stroke="#4a2c12" stroke-width="2" stroke-linecap="round"/><ellipse cx="10" cy="16" rx="6.5" ry="8.5" fill="#b87333"/><path d="M2 10c0-4 3.5-5.5 8-5.5s8 1.5 8 5.5c0 1-1 1.5-8 1.5S2 11 2 10z" fill="#5c3317"/></svg>`,
      pumpkin: s => `<svg viewBox="0 0 40 36" width="${s}" height="${s*0.9}"><path d="M20 9c-1-4 1-7 4-8" stroke="#5a6b2a" stroke-width="2.6" fill="none" stroke-linecap="round"/><ellipse cx="11" cy="22" rx="9" ry="12" fill="#b85f1a"/><ellipse cx="29" cy="22" rx="9" ry="12" fill="#b85f1a"/><ellipse cx="20" cy="22" rx="9.5" ry="13" fill="#d97b28"/><path d="M20 10v24" stroke="#b85f1a" stroke-width="1" opacity="0.6"/></svg>`,
      gourd: s => `<svg viewBox="0 0 24 34" width="${s*0.7}" height="${s}"><path d="M12 6c0-3 1-5 3-5" stroke="#5a6b2a" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="12" cy="12" rx="5" ry="6" fill="#c9a84c"/><ellipse cx="12" cy="24" rx="9" ry="9" fill="#d9b44a"/><path d="M8 20c2 4 6 4 8 0" stroke="#5a6b2a" stroke-width="1.4" fill="none"/></svg>`,
      shock: () => `<svg viewBox="0 0 60 110"><path d="M30 8L6 110M30 8L14 110M30 8L22 110M30 8L30 110M30 8L38 110M30 8L46 110M30 8L54 110" stroke="#a88b4a" stroke-width="3" stroke-linecap="round"/><path d="M30 8L10 110M30 8L50 110M30 8L26 110M30 8L42 110M30 8L18 110" stroke="#8b7a3c" stroke-width="2.4" stroke-linecap="round"/><path d="M30 10l-8-9M30 10l0-10M30 10l8-9" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/><rect x="19" y="34" width="22" height="5" rx="2" fill="#6b2020"/></svg>`,
      turkey: () => {
        const feathers = [-65,-42,-20,0,20,42].map((a, i) =>
          `<ellipse cx="20" cy="12" rx="6" ry="15" fill="${['#6b2020','#c46a1f','#c9a84c'][i % 3]}" transform="rotate(${a} 22 30)"/>`).join('');
        return `<svg viewBox="0 0 60 52">${feathers}
          <ellipse cx="30" cy="33" rx="14" ry="10.5" fill="#5c3317"/>
          <ellipse cx="27" cy="32" rx="7" ry="5" fill="#7a4a26"/>
          <g class="head">
            <path d="M39 30c3-4 4-8 5-12" stroke="#7a4a26" stroke-width="5" stroke-linecap="round" fill="none"/>
            <circle cx="45.5" cy="15" r="4.5" fill="#8b5e3c"/>
            <circle cx="47" cy="14" r="1" fill="#0c0a08"/>
            <path d="M49.5 14.5l4.5 1.2-4.5 1.2z" fill="#c9a84c"/>
            <ellipse cx="49" cy="20" rx="1.6" ry="3.4" fill="#a33b1c"/>
          </g>
          <path d="M28 43l-1 7M34 43l1 7M25 50h4M33 50h4" stroke="#c9a84c" stroke-width="1.6" stroke-linecap="round"/>
        </svg>`;
      },
      flyingTurkey: s => `<svg viewBox="0 0 60 30" width="${s}" height="${s/2}"><path d="M4 16c8-10 18-12 26-6 8-6 18-4 26 6-8-3-16-2-22 4l-4 4-4-4c-6-6-14-7-22-4z" fill="#1a120c"/><circle cx="8" cy="13" r="3" fill="#1a120c"/><path d="M50 16l8 4-8 2z" fill="#1a120c"/></svg>`
    };

    /* ---------- stars ---------- */
    const sky = document.getElementById('sky');
    for (let i = 0; i < 70; i++) {
      const s = document.createElement('div'); s.className = 'star';
      s.style.left = rand(0, 100) + '%'; s.style.top = rand(0, 60) + '%';
      s.style.animationDuration = rand(1.5, 4) + 's';
      s.style.animationDelay = -rand(0, 4) + 's';
      sky.appendChild(s);
    }

    /* ---------- spiraling leaves ---------- */
    const leaves = document.getElementById('leaves');
    function makeLeaf() {
      const l = document.createElement('div'); l.className = 'leaf';
      const r = Math.random();
      l.innerHTML = r < 0.45 ? svg.maple(rand(16, 30), pick(colors))
                  : r < 0.85 ? svg.leaf(rand(14, 24), pick(colors))
                  : svg.acorn(rand(12, 18));
      const dur = rand(10, 18);
      l.style.left = rand(0, 100) + 'vw';
      l.style.animationDuration = dur + 's';
      l.style.setProperty('--sx', rand(30, 90) * (Math.random() < 0.5 ? -1 : 1) + 'px');
      leaves.appendChild(l);
      setTimeout(() => l.remove(), dur * 1000 + 500);
    }
    setInterval(makeLeaf, 600);
    for (let i = 0; i < 18; i++) setTimeout(makeLeaf, i * 200);

    /* ---------- flocks flying overhead ---------- */
    function flock() {
      const n = 3 + (Math.random() * 4 | 0);
      const baseTop = rand(4, 22);
      const dur = rand(12, 17);
      for (let i = 0; i < n; i++) {
        const f = document.createElement('div'); f.className = 'flyer';
        f.innerHTML = svg.flyingTurkey(rand(34, 48));
        f.style.top = `calc(${baseTop}vh + ${i * 16 + (i % 2) * 10}px)`;
        f.style.animationDuration = dur + 's';
        f.style.animationDelay = (i * 0.35) + 's';
        f.style.setProperty('--drop', rand(10, 60) + 'px');
        f.querySelector('svg').style.animationDelay = -rand(0, 0.35) + 's';
        document.body.appendChild(f);
        setTimeout(() => f.remove(), (dur + i * 0.35) * 1000 + 500);
      }
    }
    setTimeout(flock, 1200);
    setInterval(flock, 14000);

    /* ---------- fence + farmyard ---------- */
    function buildYard() {
      const yard = document.getElementById('yard');
      yard.querySelectorAll('.it').forEach(e => e.remove());
      const W = window.innerWidth, H = 80;
      let posts = '';
      for (let x = 10; x < W; x += 70) {
        posts += `<path d="M${x} ${H}V14l6-8 6 8v${H}" fill="#2a1c12"/>`;
      }
      document.getElementById('fence').innerHTML =
        `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <rect x="0" y="26" width="${W}" height="9" fill="#33231a"/>
          <rect x="0" y="52" width="${W}" height="9" fill="#33231a"/>${posts}</svg>`;

      const small = W < 520;
      const u = small ? 0.62 : 1;
      const spots = [
        { html: svg.shock(),   l: 2,  w: 70,  cls: 'shock' },
        { html: svg.pumpkin(100), l: 9,  w: 64 },
        { html: svg.turkey(),  l: 17, w: 84,  cls: 'peck' },
        { html: svg.gourd(60), l: 27, w: 28 },
        { html: svg.pumpkin(100), l: 31, w: 44 },
        { html: svg.acorn(30), l: 38, w: 16 },
        { html: svg.pumpkin(100), l: 57, w: 50 },
        { html: svg.gourd(60), l: 63, w: 30 },
        { html: svg.turkey(),  l: 69, w: 78,  cls: 'peck', flip: true, delay: 1.1 },
        { html: svg.pumpkin(100), l: 80, w: 70 },
        { html: svg.shock(),   l: 90, w: 76,  cls: 'shock' },
      ];
      spots.forEach(sp => {
        const el = document.createElement('div');
        el.className = 'it' + (sp.cls ? ' ' + sp.cls : '');
        el.style.left = sp.l + '%';
        el.style.width = (sp.w * u) + 'px';
        el.innerHTML = sp.html;
        if (sp.flip) el.firstElementChild.style.transform = 'scaleX(-1)';
        if (sp.delay) { const h = el.querySelector('.head'); if (h) h.style.animationDelay = sp.delay + 's'; }
        yard.appendChild(el);
      });
    }
    buildYard();
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(buildYard, 200); });

    /* ---------- card corner clusters ---------- */
    function buildCluster(id) {
      const c = document.getElementById(id);
      const parts = [
        { h: svg.maple(58, '#a33b1c'), x: 6,  y: 30, r: -30 },
        { h: svg.maple(50, '#c9a84c'), x: 40, y: 8,  r: 10 },
        { h: svg.leaf(44, '#b87333'),  x: 0,  y: 70, r: -70 },
        { h: svg.maple(42, '#6b2020'), x: 78, y: 26, r: 40 },
        { h: svg.pumpkin(40),          x: 34, y: 50, r: -6, up: true },
        { h: svg.acorn(24),            x: 72, y: 60, r: 20, up: true },
        { h: svg.acorn(20),            x: 18, y: 10, r: -20, up: true },
      ];
      const flipped = id === 'clusterBR';
      parts.forEach(p => {
        if (flipped && p.up) p = { ...p, r: p.r + 180 };
        const el = document.createElement('div'); el.className = 'c';
        el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
        el.style.setProperty('--r0', (p.r - 6) + 'deg');
        el.style.setProperty('--r1', (p.r + 6) + 'deg');
        el.style.animationDuration = rand(1.8, 3.2) + 's';
        el.style.animationDelay = -rand(0, 3) + 's';
        el.innerHTML = p.h;
        c.appendChild(el);
      });
    }
    buildCluster('clusterTL'); buildCluster('clusterBR');

    /* ---------- maple branch ---------- */
    const branch = document.getElementById('branch');
    const bark = '#3a2616';
    branch.innerHTML = `<svg class="wood" viewBox="0 0 400 300" preserveAspectRatio="none">
      <g fill="none" stroke="${bark}" stroke-linecap="round">
        <path d="M410 28C340 38 290 58 230 85" stroke-width="17"/>
        <path d="M230 85C180 108 140 126 90 144" stroke-width="11"/>
        <path d="M90 144C70 150 50 155 25 160" stroke-width="6"/>
        <path d="M300 50C290 22 270 10 250 5" stroke-width="7"/>
        <path d="M232 86C222 130 204 168 182 200" stroke-width="7"/>
        <path d="M160 115C150 92 132 80 110 70" stroke-width="5"/>
        <path d="M120 132C110 168 96 190 80 210" stroke-width="4"/>
        <path d="M335 40C322 88 332 128 318 172" stroke-width="7"/>
      </g></svg>`;
    const clusterPts = [[250,5],[268,16],[182,200],[196,174],[110,70],[126,80],[80,210],[92,190],
                        [25,160],[42,152],[318,172],[327,140],[205,98],[62,152],[352,34],[282,62],[150,122],[330,100]];
    const branchLeaves = [];
    clusterPts.forEach(([x, y]) => {
      const n = 4 + (Math.random() * 3 | 0);
      for (let i = 0; i < n; i++) {
        const el = document.createElement('div'); el.className = 'bl';
        const isAcorn = Math.random() < 0.15;
        const w = isAcorn ? rand(2.4, 3.2) : rand(7, 12);
        el.style.width = w + '%';
        el.style.left = `calc(${(x + rand(-16, 16)) / 4}% - ${w / 2}%)`;
        el.style.top = ((y + rand(-10, 14)) / 3) + '%';
        const r = rand(-60, 60);
        el.style.setProperty('--r0', (r - 10) + 'deg');
        el.style.setProperty('--r1', (r + 10) + 'deg');
        el.style.animationDuration = rand(1.4, 2.8) + 's';
        el.style.animationDelay = -rand(0, 3) + 's';
        el.innerHTML = isAcorn ? svg.acorn(30)
                               : svg.maple(40, pick(['#a33b1c','#c46a1f','#c9a84c','#b87333','#6b2020']));
        branch.appendChild(el);
        branchLeaves.push(el);
      }
    });
    const perch = document.createElement('div'); perch.className = 'perch';
    perch.style.left = '40%'; perch.style.top = '15.5%';
    perch.innerHTML = svg.turkey();
    branch.appendChild(perch);

    /* leaves letting go of the branch */
    function dropFromBranch() {
      const src = pick(branchLeaves).getBoundingClientRect();
      const l = document.createElement('div'); l.className = 'leaf';
      l.innerHTML = svg.maple(rand(18, 26), pick(colors));
      l.style.left = src.left + 'px';
      l.style.top = src.top + 'px';
      const dur = rand(9, 14);
      l.style.animationDuration = dur + 's';
      l.style.setProperty('--sx', rand(30, 80) * (Math.random() < 0.5 ? -1 : 1) + 'px');
      leaves.appendChild(l);
      setTimeout(() => l.remove(), dur * 1000 + 500);
    }
    setInterval(dropFromBranch, 1400);
  </script>
</body>
</html>
